# Banco de TESTE separado do banco de uso. Os testes recriam o esquema deste banco a cada caso
# e se recusam a rodar se o nome do banco não terminar em "_test".
spring.datasource.url=${HB_TEST_DB_URL:jdbc:postgresql://localhost:5432/hospedabem_test}
spring.datasource.username=${HB_TEST_DB_USER:hospedabem}
spring.datasource.password=${HB_TEST_DB_PASSWORD:hospedabem}
spring.datasource.hikari.maximum-pool-size=6
