# HospedaBem - aplicação desktop: sem servidor web.
spring.main.web-application-type=none
spring.main.banner-mode=off

# Credenciais externas (variáveis de ambiente). Os valores após ":" são padrões de desenvolvimento.
spring.datasource.url=${HB_DB_URL:jdbc:postgresql://localhost:5432/hospedabem}
spring.datasource.username=${HB_DB_USER:hospedabem}
spring.datasource.password=${HB_DB_PASSWORD:hospedabem}

# RNF-1: 10 s para obter conexão/gravar; RNF-3: até 15 estações x 3 conexões cabem no padrão do PostgreSQL (100).
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.data-source-properties.connectTimeout=10
spring.datasource.hikari.data-source-properties.socketTimeout=30
spring.datasource.hikari.data-source-properties.ApplicationName=HospedaBem
spring.datasource.hikari.data-source-properties.options=-c statement_timeout=10000 -c lock_timeout=8000

logging.level.root=WARN
logging.level.hospedabem=INFO
